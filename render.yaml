databases:
  - name: devpath-db
    databaseName: devpath
    user: devpath_user
    plan: free

services:
  # DevPath NestJS Backend API
  - type: web
    name: devpath-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run prisma:generate && npm run prisma:deploy && npm run prisma:seed && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/tracks
    envVars:
      - key: NODE_VERSION
        value: 20.14.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: devpath-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRATION
        value: 15m
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_REFRESH_EXPIRATION
        value: 7d
      - key: THROTTLE_TTL
        value: 60000
      - key: THROTTLE_LIMIT
        value: 100

  # DevPath Next.js Frontend UI
  - type: web
    name: devpath-frontend
    runtime: node
    plan: free
    region: oregon
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 20.14.0
      - key: NODE_OPTIONS
        value: --max-old-space-size=450
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://devpath-api.onrender.com/api
